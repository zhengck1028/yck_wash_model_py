# Airflow on NAS（飞牛 fnOS）—— 精简版（LocalExecutor，无 Celery/Redis）
# 适合任务少、几分钟跑完的场景，内存占用约 1-1.5GB。
#
# 部署见 DEPLOY_NAS.md。首次启动前需在同目录建 .env（数据库密码 + Airflow 配置）。

x-airflow-common: &airflow-common
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # 单人小规模：webserver 只用 1 个 worker（默认 4 个，每个 ~500MB），省内存
    AIRFLOW__WEBSERVER__WORKERS: "1"
    # 长任务（pandas 大表处理）防被误判僵尸：心跳阈值放宽到 30 分钟
    AIRFLOW__SCHEDULER__SCHEDULER_ZOMBIE_TASK_THRESHOLD: "1800"
    # 业务代码加入 Python 搜索路径（卷挂载到 /opt/airflow/project）
    PYTHONPATH: /opt/airflow/project:/opt/airflow/dags
    # 时区
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Shanghai
    TZ: Asia/Shanghai
  volumes:
    # DAG 目录
    - ./dags:/opt/airflow/dags
    # 业务代码（common / vdatabase_sync / autohome_match / else_sync 等）
    - .:/opt/airflow/project
    # 日志持久化
    - ./airflow_logs:/opt/airflow/logs
  # 业务 .env（数据库密码）注入容器
  env_file:
    - .env
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  # Airflow 元数据库（与业务 MySQL 隔离）
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - ./airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # 调度器（常驻，负责触发 DAG）
  scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Web UI（浏览器访问 NAS_IP:8080）
  webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # 一次性初始化（建元数据库表 + 创建管理员账号），跑完即退出
  # 用官方镜像内置的 _AIRFLOW_DB_MIGRATE + _AIRFLOW_WWW_USER_CREATE 机制，
  # 不覆盖 entrypoint，避免容器内 uid 无 passwd 条目导致 getuser() 报错。
  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: "${_AIRFLOW_WWW_USER_USERNAME:-admin}"
      _AIRFLOW_WWW_USER_PASSWORD: "${_AIRFLOW_WWW_USER_PASSWORD:-admin}"
    command: version
    restart: "no"
