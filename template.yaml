AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: yck_wash_model - 二手车数据清洗与车型库同步

Globals:
  Function:
    Runtime: python3.11
    Timeout: 900        # 15 分钟上限
    MemorySize: 1024    # pandas 需要足够内存
    Environment:
      Variables:
        # 数据库连接配置——从 SSM Parameter Store 注入（生产部署时替换）
        DB_YUN_HOST: !Sub '{{resolve:ssm:/yck/db_yun_host}}'
        DB_YUN_USER: !Sub '{{resolve:ssm:/yck/db_yun_user}}'
        DB_YUN_PASS: !Sub '{{resolve:ssm:/yck/db_yun_pass}}'
        DB_YUN_NAME: !Sub '{{resolve:ssm:/yck/db_yun_name}}'
        DB_IT_HOST:  !Sub '{{resolve:ssm:/yck/db_it_host}}'
        DB_IT_USER:  !Sub '{{resolve:ssm:/yck/db_it_user}}'
        DB_IT_PASS:  !Sub '{{resolve:ssm:/yck/db_it_pass}}'
        DB_IT_NAME:  !Sub '{{resolve:ssm:/yck/db_it_name}}'
        DB_IT_TEST_HOST: !Sub '{{resolve:ssm:/yck/db_it_test_host}}'
        DB_IT_TEST_USER: !Sub '{{resolve:ssm:/yck/db_it_test_user}}'
        DB_IT_TEST_PASS: !Sub '{{resolve:ssm:/yck/db_it_test_pass}}'
        DB_IT_TEST_NAME: !Sub '{{resolve:ssm:/yck/db_it_test_name}}'
        DB_VDB_HOST: !Sub '{{resolve:ssm:/yck/db_vdb_host}}'
        DB_VDB_USER: !Sub '{{resolve:ssm:/yck/db_vdb_user}}'
        DB_VDB_PASS: !Sub '{{resolve:ssm:/yck/db_vdb_pass}}'
        DB_VDB_NAME: !Sub '{{resolve:ssm:/yck/db_vdb_name}}'
        SMTP_PASS:   !Sub '{{resolve:ssm:/yck/smtp_pass}}'

Resources:

  # ── 平台清洗（按需手动触发，传 platform 参数）──
  WashPlatformFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: yck-wash-platform
      CodeUri: .
      Handler: lambda_handlers.wash_platform_handler.lambda_handler
      Description: "二手车平台数据清洗（ttp/guazi/rrc/che58/che168/yiche/youxin）"

  # ── 汽车之家车型库同步 ──
  AutohomeMatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: yck-autohome-match
      CodeUri: .
      Handler: lambda_handlers.autohome_handler.lambda_handler
      Description: "汽车之家车型数据同步到 ERP + IT 系统"

  # ── YCK 车型库增量维护 ──
  VdatabaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: yck-vdatabase-update
      CodeUri: .
      Handler: lambda_handlers.vdatabase_handler.lambda_handler
      Description: "YCK 标准车型库品牌/车系/车型 ID 自增维护"

  # ── 平台 ID 匹配 ──
  PlatIdMatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: yck-plat-id-match
      CodeUri: .
      Handler: lambda_handlers.plat_id_match_handler.lambda_handler
      Description: "各平台车型 ID 与 YCK 标准 ID 多轮迭代匹配"

  # ── 本地爬虫库 → 云端车型数据同步 ──
  VdatabaseSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: yck-vdatabase-sync
      CodeUri: .
      Handler: lambda_handlers.vdatabase_sync_handler.lambda_handler
      Description: "本地爬虫数据库车型主表/详情/新能源表同步到阿里云"
      Environment:
        Variables:
          DB_LOCAL_HOST: !Sub '{{resolve:ssm:/yck/db_local_host}}'
          DB_LOCAL_USER: !Sub '{{resolve:ssm:/yck/db_local_user}}'
          DB_LOCAL_PASS: !Sub '{{resolve:ssm:/yck/db_local_pass}}'
          DB_LOCAL_NAME: !Sub '{{resolve:ssm:/yck/db_local_name}}'

  # ── 其它数据同步（投诉/销量/口碑/经销商/裸车价）──
  ElseSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: yck-else-sync
      CodeUri: .
      Handler: lambda_handlers.else_sync_handler.lambda_handler
      Description: "投诉/经销商报价/销量/口碑/经销商信息/车主裸车价同步（按日期自动触发任务）"
      Environment:
        Variables:
          DB_LOCAL_HOST: !Sub '{{resolve:ssm:/yck/db_local_host}}'
          DB_LOCAL_USER: !Sub '{{resolve:ssm:/yck/db_local_user}}'
          DB_LOCAL_PASS: !Sub '{{resolve:ssm:/yck/db_local_pass}}'
          DB_LOCAL_NAME: !Sub '{{resolve:ssm:/yck/db_local_name}}'
